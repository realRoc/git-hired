name: site-ci

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "docs/**"
      - ".github/workflows/eval.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site:
    name: Static site checks
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject committed PostHog tokens
        run: |
          matches="$(git grep -Il -E 'phc_[A-Za-z0-9_]+' -- . || true)"
          if [ -n "$matches" ]; then
            echo "PostHog project tokens must not be committed. Matching files:"
            printf '%s\n' "$matches"
            exit 1
          fi

      - name: Validate published docs bundle
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          docs = Path("docs")
          required = [
              docs / "index.html",
              docs / "blog.html",
              docs / "skill.html",
              docs / "case-redis-scan.html",
              docs / "githire.css",
              docs / "githire-scroll.js",
              docs / "i18n.js",
              docs / "three" / "stage.js",
              docs / "three" / "scenes" / "intro.js",
              docs / "robots.txt",
              docs / "sitemap.xml",
              docs / "llms.txt",
              docs / "og.png",
              docs / "og.en.png",
              docs / "og-case-redis-scan.png",
              docs / "og-case-redis-scan.en.png",
              docs / "en" / "index.html",
              docs / "en" / "blog.html",
              docs / "en" / "skill.html",
              docs / "en" / "case-redis-scan.html",
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required published files:\n- " + "\n- ".join(missing))

          html = (docs / "index.html").read_text(encoding="utf-8")
          required_snippets = [
              'href="githire.css"',
              'src="githire-scroll.js"',
              '<canvas id="stage"',
              'id="workflow"',
              'id="rituals"',
              'id="faq"',
          ]
          missing_snippets = [snippet for snippet in required_snippets if snippet not in html]
          if missing_snippets:
              raise SystemExit("Missing expected HTML snippets:\n- " + "\n- ".join(missing_snippets))

          removed_fragments = [
              'class="scroll-cue"',
              'class="foot-slogan"',
              'class="foot-mark"',
              'class="foot-en"',
          ]
          leaked_fragments = [fragment for fragment in removed_fragments if fragment in html]
          if leaked_fragments:
              raise SystemExit("Removed layout fragments are still present:\n- " + "\n- ".join(leaked_fragments))

          class AssetParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.refs: list[str] = []

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  data = dict(attrs)
                  for key in ("href", "src"):
                      value = data.get(key)
                      if value:
                          self.refs.append(value)

          missing_refs: list[str] = []
          for html_path in docs.rglob("*.html"):
              parser = AssetParser()
              parser.feed(html_path.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  parsed = urlparse(ref)
                  if parsed.scheme or parsed.netloc or ref.startswith(("mailto:", "#")):
                      continue
                  path = parsed.path
                  if not path:
                      continue
                  if path.startswith("/"):
                      local_path = docs / path.lstrip("/")
                  else:
                      local_path = (html_path.parent / path).resolve()
                  if not local_path.exists():
                      missing_refs.append(f"{html_path.relative_to(docs)}: {ref}")

          if missing_refs:
              raise SystemExit("HTML references missing local files:\n- " + "\n- ".join(missing_refs))

          print("Published docs bundle is self-consistent.")
          PY

      - name: Smoke test static serving
        run: |
          python3 -m http.server 8000 --directory docs >/tmp/githire-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          curl -fsS http://127.0.0.1:8000/ >/dev/null
          curl -fsS http://127.0.0.1:8000/blog.html >/dev/null
          curl -fsS http://127.0.0.1:8000/skill.html >/dev/null
          curl -fsS http://127.0.0.1:8000/case-redis-scan.html >/dev/null
          curl -fsS http://127.0.0.1:8000/en/ >/dev/null
          curl -fsS http://127.0.0.1:8000/en/blog.html >/dev/null
          curl -fsS http://127.0.0.1:8000/en/skill.html >/dev/null
          curl -fsS http://127.0.0.1:8000/en/case-redis-scan.html >/dev/null
          curl -fsS http://127.0.0.1:8000/githire.css >/dev/null
          curl -fsS http://127.0.0.1:8000/githire-scroll.js >/dev/null
          curl -fsS http://127.0.0.1:8000/i18n.js >/dev/null
          curl -fsS http://127.0.0.1:8000/three/stage.js >/dev/null
          curl -fsS http://127.0.0.1:8000/three/scenes/intro.js >/dev/null
          curl -fsS http://127.0.0.1:8000/og.png >/dev/null
          curl -fsS http://127.0.0.1:8000/og.en.png >/dev/null
          curl -fsS http://127.0.0.1:8000/og-case-redis-scan.png >/dev/null
          curl -fsS http://127.0.0.1:8000/og-case-redis-scan.en.png >/dev/null
          # Crawler view: ensure the EN mirror's <head> meta is actually English,
          # not just Chinese body wrapped in English meta — i.e. real static i18n.
          en_index="$(curl -fsS http://127.0.0.1:8000/en/index.html)"
          echo "$en_index" | grep -q 'og:locale" content="en_US"' || { echo "EN mirror missing en_US locale"; exit 1; }
          echo "$en_index" | grep -q 'content="GitHire · Humans think, AI executes, humans verify' || { echo "EN mirror missing translated og:title"; exit 1; }
          echo "$en_index" | grep -q 'og:image" content="https://realroc.github.io/git-hired/og.en.png"' || { echo "EN mirror not pointing at og.en.png"; exit 1; }

      - name: Check whitespace
        run: git diff --check
