<!doctype html>
<!--
  Source HTML for og-case-redis-scan.png. Render with Chrome headless:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-sandbox --hide-scrollbars \
      --window-size=1200,630 \
      --virtual-time-budget=5000 \
      --screenshot=og-case-redis-scan.png \
      "file://$(pwd)/assets/og-card-case-redis-scan.html"

  Then `mv og-case-redis-scan.png docs/` — GitHub Pages serves /docs,
  that's the only copy that needs to exist.

  Why case-specific: Google Article structured data requires the
  image to represent the article's subject. The general GitHire brand
  card (og.png) is too generic for the incident write-up to be
  rich-result eligible.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>GitHire · Case 01 OG card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+SC:wght@400;500;600&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      background: #F6F1E8;
      font-family: "Spectral", "Noto Serif SC", "Songti SC", Georgia, serif;
      color: #181818;
      overflow: hidden;
    }
    body {
      position: relative;
      padding: 56px 80px 56px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0;
    }

    /* ── Top row ───────────────────────────────────────── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-name {
      font-family: "Spectral", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 30px;
      letter-spacing: -0.01em;
    }
    .kicker {
      font-style: italic;
      font-variant: small-caps;
      font-size: 17px;
      letter-spacing: 0.2em;
      color: #b03a3a;
      font-weight: 600;
    }

    /* ── Hero ──────────────────────────────────────────── */
    .hero {
      align-self: center;
      max-width: 1040px;
    }
    .hero-meta {
      font-style: italic;
      font-variant: small-caps;
      font-size: 18px;
      letter-spacing: 0.18em;
      color: #8A887F;
      margin-bottom: 22px;
    }
    .hero h1 {
      font-style: italic;
      font-weight: 500;
      font-size: 90px;
      line-height: 1.04;
      letter-spacing: -0.01em;
      color: #181818;
    }
    .hero h1 em {
      font-style: italic;
      background-image: linear-gradient(to bottom, transparent 60%, rgba(217,119,87,0.28) 60%, rgba(217,119,87,0.28) 92%, transparent 92%);
      padding: 0 0.04em;
    }
    .hero .period { color: #D97757; }
    .hero .stat {
      font-style: italic;
      font-weight: 600;
      color: #b03a3a;
    }

    /* ── Timeline (incident progression) ──────────────── */
    .timeline {
      margin-top: 36px;
      display: grid;
      grid-template-columns: repeat(5, auto);
      gap: 0;
      justify-content: start;
      align-items: baseline;
    }
    .timeline .step {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding-right: 28px;
      position: relative;
    }
    .timeline .step + .step::before {
      content: "→";
      position: absolute;
      left: -20px;
      top: 6px;
      color: #b8b6ad;
      font-size: 16px;
    }
    .timeline .t {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 17px;
      font-weight: 600;
      color: #181818;
      letter-spacing: 0.02em;
    }
    .timeline .e {
      font-style: italic;
      font-size: 14px;
      color: #4A4A48;
      margin-top: 2px;
    }
    .timeline .step.is-hot .t,
    .timeline .step.is-hot .e {
      color: #b03a3a;
      font-weight: 700;
    }

    /* ── Bottom row ───────────────────────────────────── */
    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .case-tag {
      font-style: italic;
      font-size: 18px;
      color: #4A4A48;
      letter-spacing: 0.04em;
    }
    .case-tag strong {
      color: #181818;
      font-weight: 600;
    }
    .url {
      font-style: italic;
      font-size: 17px;
      color: #8A887F;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <svg width="42" height="42" viewBox="0 0 36 36" aria-hidden="true">
        <g stroke="#181818" stroke-width="1.6" stroke-linecap="round" fill="none">
          <line x1="6"  y1="14" x2="6"  y2="22"/>
          <line x1="9"  y1="11" x2="9"  y2="22"/>
          <line x1="12" y1="9"  x2="12" y2="22"/>
          <line x1="15" y1="12" x2="15" y2="22"/>
          <line x1="21" y1="13" x2="21" y2="22"/>
          <line x1="24" y1="10" x2="24" y2="22"/>
          <line x1="27" y1="12" x2="27" y2="22"/>
          <line x1="30" y1="14" x2="30" y2="22"/>
        </g>
        <line x1="18" y1="7" x2="18" y2="22" stroke="#D97757" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#181818">
          <rect x="6"    y="25" width="1.6" height="6"/>
          <rect x="9"    y="25" width="0.9" height="6"/>
          <rect x="11.5" y="25" width="2.2" height="6"/>
          <rect x="15"   y="25" width="0.9" height="6"/>
          <rect x="17"   y="25" width="1.8" height="6"/>
          <rect x="20"   y="25" width="0.9" height="6"/>
          <rect x="22"   y="25" width="2.2" height="6"/>
          <rect x="25.5" y="25" width="1.1" height="6"/>
          <rect x="27.5" y="25" width="2"   height="6"/>
        </g>
      </svg>
      <span class="brand-name">GitHire</span>
    </div>
    <p class="kicker">CASE 01 · PRODUCTION INCIDENT</p>
  </div>

  <section class="hero">
    <p class="hero-meta">Real prompt · real diff · real 503 · 2026-05-18</p>
    <h1>
      <em><span class="stat">22 行</span> SCAN</em>，<br/>
      <em><span class="stat">20 分钟</span></em> 到事故<span class="period">.</span>
    </h1>

    <div class="timeline">
      <div class="step">
        <span class="t">10:19</span>
        <span class="e">prompt</span>
      </div>
      <div class="step">
        <span class="t">10:24</span>
        <span class="e">AI 写 SCAN</span>
      </div>
      <div class="step">
        <span class="t">10:39</span>
        <span class="e">commit</span>
      </div>
      <div class="step">
        <span class="t">21:35</span>
        <span class="e">PR 合入</span>
      </div>
      <div class="step is-hot">
        <span class="t">23:54</span>
        <span class="e">503 · 救火</span>
      </div>
    </div>
  </section>

  <div class="bottom">
    <p class="case-tag">
      Walk the <strong>6-step workflow</strong> · see where the incident hid
    </p>
    <p class="url">realroc.github.io/git-hired/case-redis-scan</p>
  </div>
</body>
</html>
