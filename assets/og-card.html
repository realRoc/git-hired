<!doctype html>
<!--
  Source HTML for og.png. Render with Chrome headless to regenerate:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --no-sandbox --hide-scrollbars \
      --window-size=1200,630 \
      --virtual-time-budget=5000 \
      --screenshot=og.png \
      "file://$(pwd)/assets/og-card.html"

  Then `mv og.png docs/og.png` — GitHub Pages serves /docs, that's the
  only copy that needs to exist.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>GitHire · OG card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Noto+Serif+SC:wght@400;500;600&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      background: #F6F1E8;
      font-family: "Spectral", "Noto Serif SC", "Songti SC", Georgia, serif;
      color: #181818;
      overflow: hidden;
    }
    body {
      position: relative;
      padding: 64px 80px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 0;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-name {
      font-family: "Spectral", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 32px;
      letter-spacing: -0.01em;
    }
    .kicker {
      font-style: italic;
      font-variant: small-caps;
      font-size: 18px;
      letter-spacing: 0.18em;
      color: #8A887F;
    }

    .hero {
      align-self: center;
      max-width: 1040px;
    }
    .hero-meta {
      font-style: italic;
      font-variant: small-caps;
      font-size: 19px;
      letter-spacing: 0.18em;
      color: #8A887F;
      margin-bottom: 26px;
    }
    .hero h1 {
      font-style: italic;
      font-weight: 500;
      font-size: 96px;
      line-height: 1.06;
      letter-spacing: -0.01em;
      color: #181818;
    }
    .hero h1 em {
      font-style: italic;
      background-image: linear-gradient(to bottom, transparent 60%, rgba(217,119,87,0.26) 60%, rgba(217,119,87,0.26) 92%, transparent 92%);
      padding: 0 0.04em;
    }
    .hero .period { color: #D97757; }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .six-steps {
      font-style: italic;
      font-size: 19px;
      letter-spacing: 0.06em;
      color: #4A4A48;
    }
    .six-steps strong {
      color: #181818;
      font-weight: 600;
    }
    .url {
      font-style: italic;
      font-size: 19px;
      color: #8A887F;
      letter-spacing: 0.04em;
    }

    /* Decorative barcode bars (from the GitHire mark) */
    .barcode {
      position: absolute;
      top: 64px;
      right: 80px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 60px;
    }
    .barcode span {
      display: block;
      width: 4px;
      background: #181818;
    }
    .barcode .accent { background: #D97757; width: 4px; }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <!-- GitHire logo mark, simplified from logo.svg -->
      <svg width="44" height="44" viewBox="0 0 36 36" aria-hidden="true">
        <g stroke="#181818" stroke-width="1.6" stroke-linecap="round" fill="none">
          <line x1="6"  y1="14" x2="6"  y2="22"/>
          <line x1="9"  y1="11" x2="9"  y2="22"/>
          <line x1="12" y1="9"  x2="12" y2="22"/>
          <line x1="15" y1="12" x2="15" y2="22"/>
          <line x1="21" y1="13" x2="21" y2="22"/>
          <line x1="24" y1="10" x2="24" y2="22"/>
          <line x1="27" y1="12" x2="27" y2="22"/>
          <line x1="30" y1="14" x2="30" y2="22"/>
        </g>
        <line x1="18" y1="7" x2="18" y2="22" stroke="#D97757" stroke-width="1.8" stroke-linecap="round"/>
        <g fill="#181818">
          <rect x="6"   y="25" width="1.6" height="6"/>
          <rect x="9"   y="25" width="0.9" height="6"/>
          <rect x="11.5" y="25" width="2.2" height="6"/>
          <rect x="15"  y="25" width="0.9" height="6"/>
          <rect x="17"  y="25" width="1.8" height="6"/>
          <rect x="20"  y="25" width="0.9" height="6"/>
          <rect x="22"  y="25" width="2.2" height="6"/>
          <rect x="25.5" y="25" width="1.1" height="6"/>
          <rect x="27.5" y="25" width="2"   height="6"/>
        </g>
      </svg>
      <span class="brand-name">GitHire</span>
    </div>
    <p class="kicker">Real cases from AI-native teams</p>
  </div>

  <section class="hero">
    <p class="hero-meta">AI-native engineering · operating log</p>
    <h1>
      <em>人指挥</em> AI <em>干活</em>，<br/>
      不是 AI 辅助人<span class="period">.</span>
    </h1>
  </section>

  <div class="bottom">
    <p class="six-steps">
      Issue · Sandbox · Execute · AI Review · <strong>Architect</strong> · Production
    </p>
    <p class="url">realroc.github.io/git-hired</p>
  </div>
</body>
</html>
