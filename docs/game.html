<head>

  <meta name="description" content="一张 AI-native 工程地图：用 WASD 或方向键移动，走遍六步 workflow，迎战七种工程反模式怪物。人指挥 AI 干活，不是 AI 辅助人。" />
  <meta property="og:title" content="PokeHire · GitHire 知识冒险" />
  <meta property="og:description" content="探索 AI-native 工程地图，迎战七种反模式怪物——答对驱散它们，答错失去 HP，HP 归零生产 503。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Spectral:ital,wght@0,400;0,500;0,600&display=swap" />
  <link rel="stylesheet" href="githire.css" />

  <!-- Zpix · 开源中文像素字体 (MIT, SolidZORO/zpix-pixel-font) -->
  <style>
    @font-face {
      font-family: 'Zpix';
      src: url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@3.1.11/website/zpix.woff2') format('woff2');
      font-display: swap;
    }
  </style>

  <style>
    /* ── 像素主题基础 ─────────────────────────────────────── */
    :root{
      --fp:  'Zpix', 'Press Start 2P', monospace;       /* 正文(含中文)像素字体 */
      --fp2: 'Press Start 2P', 'Zpix', monospace;       /* 拉丁标题 */
      --rink:   #1f2430;
      --rpaper: #f4f0e4;
      --rgrass: #7ec850;
      --rblue:  #2e86c1;
      --rgreen: #3f9442;
      --rred:   #c0392b;
      --rgold:  #f4c430;
      --accent: #D97757;
      --panel:  #fffdf3;
      --panel-d:#2a2f3d;
    }
    #stage { display: none; }
    main, .topnav, .site-foot { position: relative; z-index: 1; }
    html, body { font-family: var(--fp); color: var(--rink); }
    body { background: #e7efd6; image-rendering: pixelated; }
    button, .a-btn, .g-btn, .btn-continue { font-family: var(--fp); }

    .game-wrap { padding-top: 64px; min-height: 100vh; }
    .spr { image-rendering: pixelated; display: block; }

    /* 像素框：硬边 + 实心投影 */
    .pbox {
      background: var(--panel);
      border: 3px solid var(--rink);
      border-radius: 0;
      box-shadow: 5px 5px 0 rgba(31,36,48,.22);
    }

    /* ── 居中屏 ───────────────────────────────────────────── */
    .screen-center {
      min-height: calc(100vh - 64px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem clamp(20px, 6vw, 80px);
    }

    /* ── 标题屏 ───────────────────────────────────────────── */
    .title-eyebrow { font-family: var(--fp2); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 1.4rem; }
    .title-logo { font-family: var(--fp2); font-size: clamp(1.6rem, 6vw, 3.2rem); line-height: 1.1; letter-spacing: 0; margin: 0 0 1.1rem; color: var(--rink); text-shadow: 4px 4px 0 var(--accent); }
    .title-logo em { color: var(--accent); font-style: normal; text-shadow: 4px 4px 0 var(--rink); }
    .title-tagline { font-size: .95rem; color: var(--rink); margin: 0 0 1.8rem; line-height: 1.7; }
    .monster-row { display: flex; justify-content: center; flex-wrap: wrap; gap: clamp(.4rem, 2.2vw, 1rem); margin: 0 0 2rem; }
    .monster-row .spr { animation: bob 2.4s steps(2) infinite; }
    .monster-row .spr:nth-child(2){animation-delay:.3s}
    .monster-row .spr:nth-child(3){animation-delay:.6s}
    .monster-row .spr:nth-child(4){animation-delay:.9s}
    .monster-row .spr:nth-child(5){animation-delay:1.2s}
    .monster-row .spr:nth-child(6){animation-delay:1.5s}
    .monster-row .spr:nth-child(7){animation-delay:1.8s}
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .title-desc { font-size: .82rem; color: var(--rink); line-height: 2; max-width: 460px; margin: 0 0 2rem; }
    .title-hint { margin-top: 1.2rem; font-size: .62rem; color: #6a6f55; }
    .kbd { display:inline-block; border:2px solid var(--rink); border-radius:0; padding:.08rem .35rem; font-size:.62rem; background:#fff; margin:0 .12rem; box-shadow:2px 2px 0 rgba(31,36,48,.2); }

    /* ── 地图屏 ───────────────────────────────────────────── */
    .map-screen { max-width: 920px; margin: 0 auto; padding: 1rem clamp(12px, 3vw, 40px) 2.5rem; }

    .hud {
      display: flex; align-items: center; gap: .6rem;
      background: var(--panel-d); color: #fff;
      border: 3px solid var(--rink); border-radius: 0;
      box-shadow: 4px 4px 0 rgba(31,36,48,.25);
      padding: .55rem .9rem; margin-bottom: .8rem; flex-wrap: wrap;
      font-size: .68rem;
    }
    .hud-label { white-space: nowrap; color: var(--rgold); }
    .hud-track { flex: 1; min-width: 90px; height: 12px; background: #11141d; border: 2px solid #000; }
    .hud-fill { height: 100%; transition: width .4s steps(8), background .4s; }
    .hud-val { white-space: nowrap; }
    .hud-chip { background: var(--accent); color:#fff; padding:.2rem .55rem; border:2px solid #000; white-space:nowrap; }
    .hud-prog { background: var(--rblue); color:#fff; padding:.2rem .55rem; border:2px solid #000; white-space:nowrap; }

    .map-stage { position: relative; line-height: 0; }
    canvas#map {
      display: block; width: 100%; height: auto;
      border: 4px solid var(--rink); border-radius: 0;
      background: #6f8f5a;
      image-rendering: pixelated;
      box-shadow: 6px 6px 0 rgba(31,36,48,.25);
      touch-action: none;
    }
    .map-banner {
      position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
      background: var(--panel-d); color: #fff;
      border: 3px solid var(--rink);
      padding: .5rem .9rem; font-size: .72rem;
      pointer-events: none; max-width: 90%; text-align: center;
      transition: opacity .25s steps(3); line-height: 1.6;
    }
    .map-foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
    .map-tip { font-size: .68rem; color: #4a4f3a; line-height: 1.9; }

    .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(3, 50px); gap: 5px; }
    .dpad button {
      border: 3px solid var(--rink); background: var(--panel); border-radius: 0;
      font-size: 1.1rem; cursor: pointer; color: var(--rink);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 rgba(31,36,48,.25);
      -webkit-user-select: none; user-select: none; touch-action: manipulation;
    }
    .dpad button:active { background: var(--accent); color:#fff; transform: translate(2px,2px); box-shadow: 1px 1px 0 rgba(31,36,48,.25); }
    .dpad .dp-up { grid-column: 2; grid-row: 1; }
    .dpad .dp-left { grid-column: 1; grid-row: 2; }
    .dpad .dp-down { grid-column: 2; grid-row: 3; }
    .dpad .dp-right { grid-column: 3; grid-row: 2; }
    .dpad .dp-mid { grid-column: 2; grid-row: 2; border-style: dashed; opacity:.4; cursor:default; box-shadow:none; }
    .dpad .dp-mid:active { background:var(--panel); color:var(--rink); transform:none; }

    /* ── 战斗屏 ───────────────────────────────────────────── */
    .battle { max-width: 780px; margin: 0 auto; padding: 1.2rem clamp(14px, 4vw, 44px) 4rem; }

    .player-bar {
      display:flex; align-items:center; gap:.6rem; background:var(--panel-d); color:#fff;
      border:3px solid var(--rink); box-shadow:4px 4px 0 rgba(31,36,48,.25);
      padding:.55rem .9rem; margin-bottom:1rem; flex-wrap:wrap; font-size:.68rem;
    }
    .pb-label { white-space:nowrap; color:var(--rgold); }
    .pb-track { flex:1; min-width:90px; height:12px; background:#11141d; border:2px solid #000; }
    .pb-fill { height:100%; transition:width .45s steps(8), background .45s; }
    .pb-val { white-space:nowrap; }
    .pb-chip { margin-left:auto; background:var(--accent); color:#fff; padding:.2rem .55rem; border:2px solid #000; white-space:nowrap; }

    .monster-card {
      background:var(--panel); border:3px solid var(--rink); border-radius:0;
      box-shadow:5px 5px 0 rgba(31,36,48,.22);
      padding:1.1rem 1.2rem; margin-bottom:1rem; position:relative;
    }
    .monster-card::before { content:''; position:absolute; top:0; left:0; right:0; height:6px; background:var(--mc, var(--accent)); }
    .mc-header { display:flex; align-items:flex-start; gap:1rem; margin-bottom:.7rem; }
    .mc-emoji { flex-shrink:0; }
    .mc-emoji .spr { animation: bob 2.6s steps(2) infinite; }
    .mc-meta { flex:1; min-width:0; }
    .mc-name { font-size:1rem; color:var(--mc,var(--rink)); margin:.1rem 0 .4rem; line-height:1.3; }
    .mc-zone { display:inline-block; padding:.18rem .5rem; background:var(--mc,var(--accent)); color:#fff; font-size:.6rem; border:2px solid var(--rink); }
    .mc-pips { display:flex; gap:5px; margin-top:.6rem; align-items:center; }
    .pip { width:22px; height:11px; border:2px solid var(--mc,var(--accent)); }
    .pip.full { background:var(--mc,var(--accent)); }
    .pip.empty { background:transparent; }
    .mc-pips-label { font-size:.6rem; color:#6a6f55; margin-left:.25rem; }
    .mc-flavor { font-size:.74rem; color:#3a3f30; border-top:2px solid #d8d2bf; padding-top:.7rem; line-height:1.95; }

    .q-card { background:var(--panel); border:3px solid var(--rink); border-radius:0; box-shadow:5px 5px 0 rgba(31,36,48,.22); padding:1.2rem; margin-bottom:.9rem; }
    .q-meta { font-family:var(--fp2); font-size:.55rem; letter-spacing:.06em; color:var(--accent); text-transform:uppercase; margin:0 0 .9rem; }
    .q-text { font-size:.92rem; line-height:1.9; color:var(--rink); margin:0 0 1.3rem; }
    .answers { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    @media (max-width:560px){ .answers{ grid-template-columns:1fr; } }
    .a-btn {
      text-align:left; padding:.7rem .85rem; border:3px solid var(--rink); border-radius:0;
      background:#fff; color:var(--rink); font-size:.78rem; line-height:1.7; cursor:pointer;
      box-shadow:3px 3px 0 rgba(31,36,48,.18); transition:transform .05s, box-shadow .05s;
    }
    .a-btn:not(:disabled):hover { background:#fff6ef; }
    .a-btn:not(:disabled):active { transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(31,36,48,.18); }
    .a-btn .lbl { color:var(--accent); margin-right:.3rem; }
    .a-btn.a-reveal { background:#cdeccd; border-color:#2d7d46; color:#16431f; }
    .a-btn.a-wrong { background:#f6cccc; border-color:#c0392b; color:#7a1b14; }
    .a-btn:disabled { cursor:default; box-shadow:none; }

    .battle-log { font-size:.74rem; color:#fff; background:var(--panel-d); border:3px solid var(--rink); padding:.7rem .9rem; min-height:2.4rem; margin-bottom:.9rem; line-height:1.7; }
    .exp-line { font-size:.72rem; margin-bottom:.7rem; padding-left:.2rem; line-height:1.85; }

    .btn-continue {
      display:block; width:100%; padding:.85rem; background:var(--accent); color:#fff;
      border:3px solid var(--rink); border-radius:0; font-size:.85rem; cursor:pointer;
      box-shadow:4px 4px 0 rgba(31,36,48,.25); transition:transform .05s, box-shadow .05s;
    }
    .btn-continue:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(31,36,48,.25); }

    /* 战斗结算卡 */
    .end-card { background:var(--panel); border:3px solid var(--rink); border-radius:0; box-shadow:6px 6px 0 rgba(31,36,48,.22); padding:1.7rem; text-align:center; max-width:540px; margin:0 auto; }
    .end-badge { font-size:2.6rem; display:block; margin-bottom:.7rem; animation:bob 2s steps(2) infinite; }
    .end-title { font-size:1.1rem; margin:0 0 .5rem; }
    .end-subtitle { font-size:.76rem; color:#3a3f30; margin:0 0 1.1rem; line-height:1.8; }
    .end-pips { display:flex; justify-content:center; gap:.45rem; margin:0 0 .85rem; }
    .rp { width:34px; height:15px; border:2px solid var(--rink); }
    .rp.ok { background:#2d7d46; } .rp.bad { background:#c0392b; }
    .end-learn { display:inline-block; color:var(--accent); text-decoration:none; font-size:.72rem; border-bottom:2px solid transparent; margin-bottom:1.3rem; }
    .end-learn:hover { border-bottom-color:var(--accent); }
    .bonus-note { color:#2d7d46; font-size:.74rem; margin:0 0 .85rem; }

    /* 结局屏 */
    .final-icon { font-size:4rem; display:block; margin-bottom:1rem; }
    .final-title { font-family:var(--fp2); font-size:clamp(1.1rem,4.5vw,2rem); line-height:1.3; margin:0 0 .8rem; text-shadow:3px 3px 0 rgba(31,36,48,.18); }
    .final-sub { font-size:.85rem; color:#3a3f30; margin:0 0 .5rem; }
    .final-score { color:var(--accent); font-size:.82rem; margin:0 0 1.4rem; line-height:1.8; }
    .final-body { font-size:.78rem; color:#3a3f30; line-height:2; max-width:450px; margin:0 0 2rem; }
    .btn-row { display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center; }
    .g-btn {
      padding:.7rem 1.5rem; border:3px solid var(--rink); border-radius:0; font-size:.78rem; cursor:pointer;
      text-decoration:none; display:inline-block; box-shadow:4px 4px 0 rgba(31,36,48,.22);
      transition:transform .05s, box-shadow .05s;
    }
    .g-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 rgba(31,36,48,.22); }
    .g-btn.solid { background:var(--accent); color:#fff; }
    .g-btn.ghost { background:var(--panel); color:var(--rink); }
    .final-links { margin-top:2rem; font-size:.62rem; color:#6a6f55; line-height:2; }
    .final-links a { color:var(--accent); }
    .share-ok { color:#2d7d46; font-size:.72rem; margin-top:.6rem; display:none; }

    @keyframes shake { 0%,100%{transform:translateX(0)} 15%,45%,75%{transform:translateX(-6px)} 30%,60%,90%{transform:translateX(6px)} }
    .do-shake { animation:shake .42s steps(3); }

    .nav-game-link { font-family:var(--fp); font-size:12px; color:var(--accent); text-decoration:none; padding:10px 16px; border:2px solid var(--accent); border-radius:0; }
  </style>
</head>

  <div class="game-wrap"><div id="gr"></div></div>

<script>
// ================================================================
// 数据：七种工程反模式怪物
// ================================================================
const MONSTERS = [
  { id:'ghost', name:'模糊 Issue 幽灵', emoji:'👻', color:'#6c3483', zone:'Issue 规格',
    flavor:'它从一句"你帮我实现一下这个功能"里诞生。没有 Goal，没有 Constraints，没有 Verification——AI 当然找到了一个答案，只是不是你要的那个。每一处空白，都是它的入口。',
    learnHref:'./index.html#workflow', learnText:'阅读六步 Workflow' },
  { id:'fire', name:'无沙盒妖', emoji:'🔥', color:'#b7770d', zone:'沙盒环节',
    flavor:'它最喜欢"先上线看看"。没有隔离环境，没有生产量级的数据，AI 写出来的第一版在本地跑得飞快——然后在生产环境沉默地爆了。',
    learnHref:'./index.html#workflow', learnText:'阅读 Sandbox 步骤' },
  { id:'scan', name:'SCAN 兽', emoji:'🦕', color:'#c0392b', zone:'Case 01 · 真实事故',
    flavor:'2026-05-18 10:19，一条 prompt，22 行代码。23:54，生产 Redis 应声倒下。SCAN + pipeline HGETALL 每次请求扫 800 万条 key——AI review 看不出来，因为代码本身"逻辑正确"。',
    learnHref:'./case-redis-scan.html', learnText:'阅读 Case 01 完整复盘' },
  { id:'dragon', name:'甩锅龙', emoji:'🐉', color:'#1a5276', zone:'架构师签字',
    flavor:'它最爱说"AI 评过了"。每次有人问责，就用这句话挡回去。签字栏永远空着——因为没有人想为 AI 生成的代码背系统侧的锅。',
    learnHref:'./index.html#workflow', learnText:'阅读 Architect 步骤' },
  { id:'zombie', name:'人月怪', emoji:'🧟', color:'#117a65', zone:'布鲁克斯定律',
    flavor:'进度落后了，再招两个人。新人需要学习上下文，沟通成本二次方上升，整体更慢了。Brooks 1975 年就写了。放到 AI-native 团队里，规律没失效，只是稀缺品换了。',
    learnHref:'./index.html#faq', learnText:'阅读 FAQ：加人还是加 framing' },
  { id:'clock', name:'Deadline 幻影', emoji:'⏳', color:'#7d3c98', zone:'交付承诺',
    flavor:'它在信息最少的时候逼你许下承诺，在压力最大的时候兑现。AI-native 时代 deadline 仍然不准，只是滑掉的原因换了：不是 coding 慢，而是 framing 失误和 review 来不及。',
    learnHref:'./index.html#faq', learnText:'阅读 FAQ：Deadline 为什么骗人' },
  { id:'robot', name:'孤岛 Agent', emoji:'🤖', color:'#4a235a', zone:'最终 Boss · 概念完整性',
    flavor:'七个 agent 并发写主干，没有一个人能用一句话说清楚整体方向。代码量翻倍，但每个模块讲的是不同的故事。这是最终 Boss——因为它长得最像"生产力"。',
    learnHref:'./index.html#faq', learnText:'阅读 FAQ：概念完整性' },
];

const QUESTIONS = {
  ghost: [
    { q:'GitHire 提倡的六段式 Prompt Spec 包含哪六段？',
      opts:['目标 / 约束 / 非目标 / 验证标准 / 架构说明 / 已有上下文','问题 / 方案 / 时间表 / 负责人 / 风险 / 评审','是什么 / 为什么 / 怎么做 / 谁来做 / 何时 / 何地','功能 / 缺陷 / 时间表 / 安全 / 性能 / 文档'],
      ans:0, exp:'六段式 Spec 是 GitHire 的 Issue framing 核心——每一段缺失，AI 就会在那里自由发挥。' },
    { q:'Issue 里的"非目标（Non-goals）"段，最核心的作用是什么？',
      opts:['告诉新同事项目的历史背景','明确不做什么，防止 AI 在未定义区域自由发挥','列出所有可交付成果','记录团队分工和责任人'],

// ================================================================
// 地图：W=墙/障碍 .=地面 S=起点 数字=怪物 G=终点(Production)
// ================================================================
const SPR = 16;                   // sprite 逻辑分辨率
const PIXEL = 3;                  // 每"像素"= 3 屏幕 px
const TILE = SPR * PIXEL;         // 48

// ── 单一箱庭世界：一张大地图（不再多图拼接）+ 镜头跟随 ────────────
const WORLD_W = 48, WORLD_H = 42;            // 世界格子尺寸
const VIEW_W = 15, VIEW_H = 11;              // 视口格子数（奇数→主角居中）
const VIEW_PXW = VIEW_W*TILE, VIEW_PXH = VIEW_H*TILE;
const WORLD_PXW = WORLD_W*TILE, WORLD_PXH = WORLD_H*TILE;

const STATUE = { x:24, y:20 };               // 中央雕像 = robot 隐藏 Boss
const SPAWN  = { x:24, y:23 };               // 出生：广场南，面朝雕像

// 区域锚点：Voronoi 生物群系 + 道路目标 + HUD 区域名
const REGIONS = [
  { key:'plaza',     theme:'town',      name:'中心广场',        cx:24, cy:20 },
  { key:'issue',     theme:'wild',      name:'Issue 荒野',      cx:9,  cy:8  },
  { key:'sandbox',   theme:'cave',      name:'Sandbox 洞穴',    cx:25, cy:5  },
  { key:'incident',  theme:'incident',  name:'Case01 事故现场',  cx:40, cy:11 },
  { key:'valley',    theme:'valley',    name:'甩锅龙谷',        cx:6,  cy:24 },
  { key:'graveyard', theme:'graveyard', name:'人月墓园',        cx:10, cy:36 },
  { key:'deadline',  theme:'tower',     name:'Deadline 钟楼',   cx:40, cy:36 },
];

// boss 落点：x,y = 触发战斗的格子；部分藏在建筑里（door 在建筑正下方）
const BOSS_SPOTS = [
  { id:'ghost',  r:1, x:9,  y:9  },
  { id:'fire',   r:2, x:25, y:8,  building:{ type:'cave',    x:23, y:3,  w:5, h:4 } },
  { id:'scan',   r:3, x:40, y:13, building:{ type:'server2', x:38, y:8,  w:5, h:4 } },
  { id:'dragon', r:4, x:6,  y:24 },
  { id:'zombie', r:5, x:10, y:36 },
  { id:'clock',  r:6, x:40, y:38, building:{ type:'tower',   x:38, y:32, w:5, h:5 } },
];

// 广场旁的装饰建筑（非 boss）
const DECO_BUILDINGS = [
  { type:'hq',  x:14, y:15, w:4, h:3, label:'GitHire 总部' },
  { type:'lib', x:30, y:15, w:4, h:3, label:'文档馆' },
];

// ── 工具 ──
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const dist  = (x,y,a,b)=> Math.hypot(x-a, y-b);
function hex2rgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function colorDist(a,b){ const p=hex2rgb(a),q=hex2rgb(b); return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]); }   // RGB 距离，<90 视为同色系
function grid(w,h,fill){ const g=[]; for(let y=0;y<h;y++){ g[y]=[]; for(let x=0;x<w;x++) g[y][x]=fill; } return g; }
function hash(x,y){ return ((x*73856093) ^ (y*19349663) ^ ((x+y)*83492791)) >>> 0; }

// ── 生物群系生成参数 ──
// 70% 纯地面 / 20% 障碍 / 10% 焦点(怪物·任务点)：障碍密度整体减半，避免每格都"有设计"
function biomeDensity(b){ return ({ wild:12, graveyard:13, valley:10, cave:9, incident:9, tower:9, town:3 })[b] ?? 8; }
function biomeObst(b,s){
  if (b==='wild')      return (s%5===0)?'rock':'tree';
  if (b==='graveyard') return (s%4===0)?'tree':'tomb';
  if (b==='valley')    return (s%3===0)?'rock':'water';
  if (b==='cave')      return (s%3===0)?'pillar':'rock';
  if (b==='incident')  return (s%3===0)?'rock':'server';
  if (b==='tower')     return (s%4===0)?'rock':'pillar';
  return (s%2===0)?'bushobst':'tree';
}

// ── 程序化生成一张连贯的箱庭世界 ──────────────────────────────────
let WORLD = null;
function buildWorld(){
  const W=WORLD_W, H=WORLD_H;
  const ground = grid(W,H,0);        // 0 草 / 1 路 / 2 砖(广场)
  const biome  = grid(W,H,'town');
  const obst   = grid(W,H,null);
  const walls  = grid(W,H,false);
  const PLZ = REGIONS[0];

  // 1) 生物群系：最近锚点（Voronoi）；广场圆盘覆盖为砖
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let best=1e9, bk='town';
    for(const r of REGIONS){ const d=(x-r.cx)**2+(y-r.cy)**2; if(d<best){best=d; bk=r.theme;} }
    biome[y][x]=bk;
  }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if (dist(x,y,PLZ.cx,PLZ.cy) <= 3.4){ ground[y][x]=2; biome[y][x]='town'; }
  }

  // 2) 道路：广场放射(大路) + 相邻区环路(绕路) + 到各 boss 的小路。2×2 加宽
  const carve = (x0,y0,x1,y1)=>{
    let x=x0, y=y0, guard=0;
    const put=(px,py)=>{ for(const [ox,oy] of [[0,0],[1,0],[0,1]]){ const a=px+ox,b=py+oy; if(a>1&&b>1&&a<W-2&&b<H-2){ if(ground[b][a]!==2) ground[b][a]=1; obst[b][a]=null; } } };
    while((x!==x1||y!==y1) && guard++<500){
      put(x,y);
      const dx=Math.sign(x1-x), dy=Math.sign(y1-y), jig=(hash(x,y)%7===0);
      if (Math.abs(x1-x) > Math.abs(y1-y)){ x+=dx; if(jig && y!==y1) y+=dy; }
      else { y+=dy; if(jig && x!==x1) x+=dx; }
    }
    put(x1,y1);
  };
  for (let i=1;i<REGIONS.length;i++) carve(PLZ.cx,PLZ.cy, REGIONS[i].cx,REGIONS[i].cy);            // 大路放射
  for (let i=1;i<REGIONS.length;i++){ const a=REGIONS[i], b=REGIONS[i%6+1]; carve(a.cx,a.cy,b.cx,b.cy); } // 环路
  for (const bs of BOSS_SPOTS){ const a=REGIONS[bs.r]; carve(a.cx,a.cy, bs.x,bs.y); }                // 到 boss 的小路

  // 3) 受保护格（锚点/雕像/boss/建筑）——障碍不在此生成、不挡路
  const prot = grid(W,H,false);
  const protDisk=(cx,cy,rad)=>{ for(let y=0;y<H;y++)for(let x=0;x<W;x++) if(dist(x,y,cx,cy)<=rad) prot[y][x]=true; };
  REGIONS.forEach(r=>protDisk(r.cx,r.cy,2));
  protDisk(STATUE.x,STATUE.y,3);
  const allB = [...BOSS_SPOTS.filter(b=>b.building).map(b=>b.building), ...DECO_BUILDINGS];
  BOSS_SPOTS.forEach(bs=>protDisk(bs.x,bs.y,2));
  allB.forEach(b=>{ for(let y=b.y-1;y<=b.y+b.h+1;y++)for(let x=b.x-1;x<=b.x+b.w;x++) if(x>=0&&y>=0&&x<W&&y<H) prot[y][x]=true; });

  // 4) 障碍散布：仅草地、非保护、非路
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(ground[y][x]!==0 || prot[y][x]) continue;
    const s=hash(x,y);
    if((s%100) < biomeDensity(biome[y][x])){ obst[y][x]=biomeObst(biome[y][x],s); walls[y][x]=true; }
  }

  // 5) 水边框：让世界像一座岛（箱庭的"框"）
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(x<1||y<1||x>=W-1||y>=H-1){ obst[y][x]='water'; walls[y][x]=true; ground[y][x]=0; }
  }

  // 6) 建筑（boss 建筑 + 装饰建筑）→ 占位为墙
  const buildings=[];
  const place=(b)=>{ buildings.push(b); for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++) if(walls[y]&&x>=0&&x<W){ walls[y][x]=true; obst[y][x]=null; } };
  BOSS_SPOTS.forEach(bs=>{ if(bs.building) place(bs.building); });
  DECO_BUILDINGS.forEach(place);

  // 7) 装饰：广场灯 + 路旁花/灌木（不挡路）
  const decor=[];
  [[20,17],[28,17],[20,23],[28,23]].forEach(([x,y])=>{ decor.push({x,y,t:'lamp'}); walls[y][x]=true; });
  for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){
    if(ground[y][x]!==0 || obst[y][x] || prot[y][x]) continue;
    const nearRoad = ground[y-1][x]===1||ground[y+1][x]===1||ground[y][x-1]===1||ground[y][x+1]===1;
    const s=hash(x*3+1,y*7+5);
    if(nearRoad && s%9===0) decor.push({x,y,t:(s%2?'flower':'bush')});  // 装饰减半：背景不抢注意力
  }

  // 8) 路牌：广场每条大路出口指向区域名
  const signs=[];
  for(let i=1;i<REGIONS.length;i++){ const r=REGIONS[i], a=Math.atan2(r.cy-PLZ.cy, r.cx-PLZ.cx);
    const sx=clamp(Math.round(PLZ.cx+Math.cos(a)*5),2,W-3), sy=clamp(Math.round(PLZ.cy+Math.sin(a)*5),2,H-3);
    signs.push({x:sx,y:sy,label:r.name}); }

  // 9) 怪物
  const monsters = BOSS_SPOTS.map(bs=>({ id:bs.id, x:bs.x, y:bs.y, building:!!bs.building }));

  WORLD = { w:W, h:H, ground, biome, obst, walls, decor, buildings, monsters, signs };
}

const THEME = {

  wild:      { g1:'#6f8f5a', g2:'#688a54', dark:'#5e7d4c', lite:'#7e996a', path:'#9b8565', pathD:'#8a7458', pathL:'#a8946d', obst:'tree', flora:true },

// ── 世界查询 / 镜头 ─────────────────────────────────────────────
function nearestRegion(x,y){ let best=1e9, r=REGIONS[0]; for(const rr of REGIONS){ const d=(x-rr.cx)**2+(y-rr.cy)**2; if(d<best){best=d; r=rr;} } return r; }
function currentRegionName(){ const p=G.player; return dist(p.x,p.y,REGIONS[0].cx,REGIONS[0].cy)<=4 ? REGIONS[0].name : nearestRegion(p.x,p.y).name; }
function othersCleared(){ return MONSTERS.filter(m=>m.id!=='robot').every(m=>G.defeated[m.id]); }
function statueAwake(){ return othersCleared(); }
function isStatue(x,y){ return x===STATUE.x && y===STATUE.y; }
function monsterAt(x,y){ for (const mm of WORLD.monsters){ if (!G.defeated[mm.id] && mm.x===x && mm.y===y) return mm.id; } return null; }
function resetPlayer(){ const p=G.player; p.x=SPAWN.x; p.y=SPAWN.y; p.tx=p.x; p.ty=p.y; p.px=p.x*TILE; p.py=p.y*TILE; p.moving=false; p.queued=null; p.bob=0; }
function camera(){
  const p=G.player;
  const cx=Math.round(p.px)-(VIEW_PXW-TILE)/2, cy=Math.round(p.py)-(VIEW_PXH-TILE)/2;
  return { cx:clamp(cx,0,WORLD_PXW-VIEW_PXW), cy:clamp(cy,0,WORLD_PXH-VIEW_PXH) };
}

// keyboard (attached once globally)
function onKey(e){
  if (G.screen !== 'map') return;
  let dx=0, dy=0;
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w')    dy=-1;
  else if (k==='arrowdown'||k==='s')  dy=1;
  else if (k==='arrowleft'||k==='a')  dx=-1;
  else if (k==='arrowright'||k==='d') dx=1;
  else return;
  e.preventDefault();
  tryStep(dx,dy);
}
document.addEventListener('keydown', onKey, { passive:false });

function tryStep(dx,dy){
  if (G.screen !== 'map') return;
  const p = G.player;
  if (p.moving){ p.queued = {dx,dy}; return; }   // 动画中：缓冲最后一次方向，结束后续走
  const nx = p.x + dx, ny = p.y + dy;
  if (nx<0||ny<0||nx>=WORLD_W||ny>=WORLD_H) return;

  // 中央雕像 = 隐藏 Boss
  if (isStatue(nx,ny)){
    if (G.defeated['robot']) { showBanner('🗿 雕像已被净化'); return; }
    if (statueAwake()) { startBattle('robot'); return; }
    const left = MONSTERS.filter(m=>m.id!=='robot' && !G.defeated[m.id]).length;
    showBanner(`🗿 雕像沉睡中 · 先清除外围 ${left} 个反模式`);
    return;
  }

  // 怪物（站位 / 建筑门口）
  const mid = monsterAt(nx,ny);
  if (mid) { startBattle(mid); return; }

  // 墙
  if (WORLD.walls[ny][nx]) { showBanner('🧱 走不过去'); return; }

  // 正常移动
  p.x = nx; p.y = ny; p.tx = nx; p.ty = ny; p.moving = true; p.t0 = performance.now();
  p.fromPx = p.px; p.fromPy = p.py;
}

function showBanner(text){
  G.bannerText = text;
  G.bannerUntil = performance.now() + 1800;
}

// map render loop
function startMapLoop(){
  const cv = document.getElementById('map');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  lastT = performance.now();
  const step = (now) => {
    if (G.screen !== 'map'){ rafId=null; return; }
    update(now);
    draw(ctx);
    rafId = requestAnimationFrame(step);
  };
  rafId = requestAnimationFrame(step);
}
function stopMapLoop(){ if (rafId){ cancelAnimationFrame(rafId); rafId=null; } }

function update(now){
  const p = G.player;
  if (p.moving){
    const k = Math.min(1, (now - p.t0)/WALK_MS);
    p.px = p.fromPx + (p.tx*TILE - p.fromPx)*k;
    p.py = p.fromPy + (p.ty*TILE - p.fromPy)*k;
    if (k>=1){
      p.moving=false; p.px=p.tx*TILE; p.py=p.ty*TILE;
      if (p.queued){ const qd=p.queued; p.queued=null; tryStep(qd.dx, qd.dy); }
    }
  }
  p.bob = Math.sin(now/260)*2;

  // banner
  const b = document.getElementById('banner');
  if (b){
    if (G.bannerText && now < G.bannerUntil){ b.textContent = G.bannerText; b.style.opacity = '1'; }
    else { b.style.opacity = '0'; G.bannerText=''; }
  }
}

// 离屏 sprite 缓存（16×16）
const SPRITE_CACHE = {};
function getSprite(id){
  if (SPRITE_CACHE[id]) return SPRITE_CACHE[id];
  const off = document.createElement('canvas');
  off.width = SPR; off.height = SPR;
  const c = off.getContext('2d');
  (SPRITE_FN[id] || (()=>{}))(c);
  SPRITE_CACHE[id] = off;
  return off;
}
function blit(ctx, id, dx, dy){
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(getSprite(id), 0,0,SPR,SPR, dx,dy,TILE,TILE);
}
// 角色/怪物的纯色剪影（用于描边）——source-in 把 sprite 染成 OUTLINE 色，缓存复用
const SIL_CACHE = {};
function getSilhouette(id){
  if (SIL_CACHE[id]) return SIL_CACHE[id];
  const off = document.createElement('canvas'); off.width=SPR; off.height=SPR;
  const c = off.getContext('2d');
  c.drawImage(getSprite(id),0,0);
  c.globalCompositeOperation='source-in';
  c.fillStyle=OUTLINE; c.fillRect(0,0,SPR,SPR);
  SIL_CACHE[id]=off; return off;
}
// 带描边的 blit：先在四向偏移画剪影，再画本体 → 角色从任何背景里"跳"出来
function blitOutlined(ctx, id, dx, dy){
  ctx.imageSmoothingEnabled = false;
  const sil = getSilhouette(id), P = PIXEL;
  for (const [ox,oy] of [[-P,0],[P,0],[0,-P],[0,P]])
    ctx.drawImage(sil, 0,0,SPR,SPR, dx+ox,dy+oy,TILE,TILE);
  ctx.drawImage(getSprite(id), 0,0,SPR,SPR, dx,dy,TILE,TILE);
}

// ── 地面（草地 / 土路 / 石砖）──────────────────────────────────
function drawGround(c,x,y,th,kind){
  const X=x*TILE, Y=y*TILE, P=PIXEL;
  if (kind==='path'){
    R(c,X,Y,TILE,TILE,th.path);
    const s=((x*73856093)^(y*19349663))>>>0;
    R(c, X+(s%15)*P,     Y+((s>>4)%15)*P,  P, P, th.pathD||'#b8965c');
    R(c, X+((s>>8)%15)*P,Y+((s>>12)%15)*P, P, P, th.pathL||'#dbbf86');
    return;
  }
  if (kind==='brick'){
    R(c,X,Y,TILE,TILE,'#c2bcae');
    for(let r=0;r<8;r++) for(let q=0;q<8;q++){
      const bx=X+q*2*P, by=Y+r*2*P, off=(r%2)?P:0;

// ── 建筑 ────────────────────────────────────────────────────────
function drawBuilding(ctx,b){
  const X=b.x*TILE, Y=b.y*TILE, W=b.w*TILE, H=b.h*TILE, P=PIXEL;
  const T=b.type;
  if (T==='hq' || T==='lib'){ drawHouse(ctx,b,X,Y,W,H,P); return; }
  if (T==='cave'){ drawCave(ctx,X,Y,W,H,P); return; }
  if (T==='server2'){ drawServerHouse(ctx,X,Y,W,H,P); return; }
  if (T==='tower'){ drawClockTower(ctx,X,Y,W,H,P); return; }
  if (T==='fortress'){ drawFortress(ctx,X,Y,W,H,P); return; }
}

  // 大门
  const dx=X+W/2-3*P;
  R(ctx,dx,Y+H-8*P,6*P,8*P,'#15111f'); R(ctx,dx+P,Y+H-7*P,4*P,7*P,'#241d33');
  // 骷髅旗
  R(ctx,X+2*P,Y+5*P,3*P,4*P,'#6c3483'); R(ctx,X+W-5*P,Y+5*P,3*P,4*P,'#6c3483');
  R(ctx,X+3*P,Y+6*P,P,P,'#fff'); R(ctx,X+W-4*P,Y+6*P,P,P,'#fff');
}

// 整张世界一次性渲染到离屏（地面+障碍+建筑+装饰+路牌）；镜头每帧 blit 子区域
let MAPBG = null, MINIMAP = null;
function buildMapBg(){
  if (!WORLD) buildWorld();
  const off = document.createElement('canvas');
  off.width = WORLD_PXW; off.height = WORLD_PXH;
  const c = off.getContext('2d');
  c.imageSmoothingEnabled = false;
  const W=WORLD.w, H=WORLD.h;
  // 地面（路统一用土路色，地貌按 biome 取草色）
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const g=WORLD.ground[y][x];
    const th = g===1 ? THEME.town : (THEME[WORLD.biome[y][x]] || THEME.town);
    drawGround(c, x, y, th, g===1?'path':g===2?'brick':'ground');
  }
  // 障碍
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const o=WORLD.obst[y][x]; if(!o) continue;
    drawObstacle(c, x, y, THEME[WORLD.biome[y][x]] || THEME.town, o);
  }
  // 建筑
  WORLD.buildings.forEach(b => drawBuilding(c,b));
  // 装饰物
  WORLD.decor.forEach(d => drawDecor(c, d.x, d.y, d.t, THEME[WORLD.biome[d.y][d.x]] || THEME.town));
  // 路牌
  c.textAlign='center'; c.textBaseline='middle';
  WORLD.signs.forEach(e => {
    const X=e.x*TILE, Y=e.y*TILE, P=PIXEL;
    R(c,X+TILE/2-P,Y+8*P,2*P,5*P,'#7a4a22');                                  // 桩
    R(c,X+P,Y+2*P,TILE-2*P,6*P,'#caa46a'); R(c,X+P,Y+2*P,TILE-2*P,P,'#e0c08a'); R(c,X+P,Y+8*P,TILE-2*P,P,'#9c7c46');
    c.fillStyle='#3a2a14'; c.font='8px Zpix, monospace';
    c.fillText(e.label, X+TILE/2, Y+5*P);
  });
  MAPBG = off;
  buildMinimap();
}
function buildMinimap(){
  const s=2, off=document.createElement('canvas');
  off.width=WORLD_W*s; off.height=WORLD_H*s;
  const c=off.getContext('2d');
  const MC={ town:'#75905b', wild:'#6f8f5a', cave:'#45454f', valley:'#6e98aa', graveyard:'#566a56', incident:'#34303a', tower:'#5e5876' };
  for(let y=0;y<WORLD_H;y++)for(let x=0;x<WORLD_W;x++){
    let col = MC[WORLD.biome[y][x]] || '#6f8f5a';
    if(WORLD.ground[y][x]===1) col='#9b8565';
    else if(WORLD.ground[y][x]===2) col='#c2bcae';
    else if(WORLD.obst[y][x]==='water') col='#3a6f96';
    else if(WORLD.walls[y][x]) col='#2a2e36';
    c.fillStyle=col; c.fillRect(x*s,y*s,s,s);
  }
  MINIMAP=off;
}
function drawFence(c,x,y){
  const X=x*TILE, Y=y*TILE, P=PIXEL;
  R(c,X,Y+6*P,TILE,2*P,'#a87a4a'); R(c,X,Y+9*P,TILE,2*P,'#8a5e34');     // 横杆
  R(c,X+2*P,Y+4*P,2*P,9*P,'#8a5e34'); R(c,X+10*P,Y+4*P,2*P,9*P,'#8a5e34'); // 立柱
  R(c,X+2*P,Y+4*P,2*P,P,'#b08a5a'); R(c,X+10*P,Y+4*P,2*P,P,'#b08a5a');
}

function draw(ctx){
  ctx.imageSmoothingEnabled = false;
  if (!MAPBG) buildMapBg();
  const cam = camera();
  // 镜头窗口
  ctx.drawImage(MAPBG, cam.cx, cam.cy, VIEW_PXW, VIEW_PXH, 0, 0, VIEW_PXW, VIEW_PXH);
  const ox=-cam.cx, oy=-cam.cy;

  // 怪物（= 任务焦点：高亮地砖环 + 描边 sprite，让玩家一眼知道"这里能打"）
  for (const mm of WORLD.monsters){
    if (G.defeated[mm.id]) continue;
    const sx=mm.x*TILE+ox, sy=mm.y*TILE+oy;
    if (sx<-TILE||sy<-TILE||sx>VIEW_PXW||sy>VIEW_PXH) continue;
    const bobY = Math.round(Math.sin(performance.now()/400 + mm.x)) * PIXEL;
    const pulse = 0.32 + 0.18*Math.sin(performance.now()/360 + mm.x);   // 呼吸高亮
    const mc = (MONSTERS.find(m=>m.id===mm.id)||{}).color || '#f4c430';
    const gcol = (THEME[WORLD.biome[mm.y][mm.x]] || THEME.town).g1;
    const sameHue = colorDist(mc, gcol) < 90;                           // 怪物色与地面同色系？
    // 焦点环：同色系 biome 用暖金对比外环防止融进地面，异色系保留低调暗环；内填始终用怪物色保辨识
    const rim = sameHue ? '#ffd76a' : '#1f2933';
    ctx.save(); ctx.globalAlpha = sameHue ? 0.72 : 0.40;
    R(ctx, sx+1*PIXEL, sy+10*PIXEL, 14*PIXEL, 5*PIXEL, rim);            // 对比色外环
    if (sameHue) R(ctx, sx+1*PIXEL, sy+10*PIXEL, 14*PIXEL, 1, '#fff2c8'); // 高光上沿
    ctx.restore();
    ctx.save(); ctx.globalAlpha = pulse;
    R(ctx, sx+3*PIXEL, sy+11*PIXEL, 10*PIXEL, 3*PIXEL, mc);             // 怪物色内填（呼吸）
    ctx.restore();
    R(ctx, sx+3*PIXEL, sy+14*PIXEL, 10*PIXEL, 2*PIXEL, 'rgba(0,0,0,.20)');
    blitOutlined(ctx, mm.id, sx, sy + bobY);
    if (mm.building){ R(ctx, sx+6*PIXEL, sy-3*PIXEL, 4*PIXEL, 2*PIXEL, '#f4c430'); R(ctx,sx+6*PIXEL,sy-3*PIXEL,4*PIXEL,1,'#fff7c0'); } // 门口微标
  }

  // 中央雕像
  drawStatue(ctx, STATUE.x*TILE+ox, STATUE.y*TILE+oy);

  // 玩家
  const p = G.player;
  const pbob = Math.round(p.bob/2) * PIXEL;
  const psx=p.px+ox, psy=p.py+oy;
  R(ctx, psx+4*PIXEL, psy+14*PIXEL, 8*PIXEL, 2*PIXEL, 'rgba(0,0,0,.22)');
  blitOutlined(ctx, 'hero', Math.round(psx), Math.round(psy) + pbob);

  // 小地图
  drawMinimap(ctx);
}

// 中央雕像：石像(锁) → 苏醒(发光) → 净化(已击败)
function drawStatue(ctx, X, Y){
  const P=PIXEL;
  const awake = statueAwake(), done = G.defeated['robot'];
  // 待解锁态：冷色地光"魔法阵"——冷色与怪物的暖色焦点环形成"暖=可挑战 / 冷=未解锁"语言
  if (!awake && !done){
    const cp = 0.16 + 0.08*Math.sin(performance.now()/780);            // 慢速冷光呼吸
    ctx.save(); ctx.globalAlpha = cp;
    R(ctx, X-4*P, Y+7*P, TILE+8*P, 9*P, '#3a64a0');                    // 冷蓝地光halo
    ctx.restore();
    R(ctx, X-4*P, Y+7*P, TILE+8*P, P, 'rgba(140,185,235,.55)');        // 冷色上沿描边
    R(ctx, X-4*P, Y+7*P, P, 9*P, 'rgba(140,185,235,.35)'); R(ctx, X+TILE+3*P, Y+7*P, P, 9*P, 'rgba(140,185,235,.35)');
  }
  // 基座
  R(ctx, X-2*P, Y+12*P, TILE+4*P, 4*P, 'rgba(0,0,0,.20)');
  R(ctx, X-2*P, Y+10*P, TILE+4*P, 4*P, '#9a8f80'); R(ctx, X-2*P, Y+10*P, TILE+4*P, P, '#b7ad9e');
  R(ctx, X-P, Y+8*P, TILE+2*P, 2*P, '#8a8073');
  if (done){
    R(ctx, X-P, Y-3*P, TILE+2*P, TILE+2*P, 'rgba(63,212,122,.18)');
    blitOutlined(ctx, 'robot', X, Y-3*P);
    R(ctx, X+6*P, Y-6*P, 4*P, 3*P, '#3fd47a');                         // 净化光环
  } else if (awake){
    const pulse=(Math.floor(performance.now()/220)%2);
    R(ctx, X-2*P, Y-4*P, TILE+4*P, TILE+4*P, pulse?'rgba(232,80,58,.32)':'rgba(244,196,48,.22)');
    blitOutlined(ctx, 'robot', X, Y-3*P);
    if (pulse){ R(ctx, X+4*P, Y, 2*P, 2*P, '#ff5a3a'); R(ctx, X+10*P, Y, 2*P, 2*P, '#ff5a3a'); }
  } else {
    blitOutlined(ctx, 'robot', X, Y-3*P);
    R(ctx, X, Y-3*P, TILE, TILE, 'rgba(96,116,156,.55)');              // 偏冷去色 → 冰封石像
    R(ctx, X+5*P, Y+1*P, 6*P, 4*P, '#c2d4ec'); R(ctx, X+6*P, Y-1*P, 4*P, 2*P, '#c2d4ec'); R(ctx, X+7*P, Y, 2*P, 2*P, '#7f97bb'); // 冷色锁
  }
}

// 右上角小地图
function drawMinimap(ctx){
  if (!MINIMAP) return;
  const s=2, mw=WORLD_W*s, mh=WORLD_H*s, mx=VIEW_PXW-mw-10, my=10;
  ctx.fillStyle='rgba(20,20,28,.82)'; ctx.fillRect(mx-3,my-3,mw+6,mh+6);
  ctx.drawImage(MINIMAP, mx, my);
  for (const mm of WORLD.monsters){
    ctx.fillStyle = G.defeated[mm.id] ? '#555' : (MONSTERS.find(m=>m.id===mm.id)||{}).color || '#fff';
    ctx.fillRect(mx+mm.x*s-1, my+mm.y*s-1, s+2, s+2);
  }
  ctx.fillStyle = G.defeated['robot'] ? '#3fd47a' : statueAwake() ? '#f4c430' : '#999';
  ctx.fillRect(mx+STATUE.x*s-2, my+STATUE.y*s-2, s+4, s+4);
  ctx.fillStyle='#fff'; ctx.fillRect(mx+G.player.x*s-1, my+G.player.y*s-1, s+2, s+2);
  const cam=camera();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
  ctx.strokeRect(mx+(cam.cx/TILE)*s, my+(cam.cy/TILE)*s, VIEW_W*s, VIEW_H*s);
  ctx.strokeStyle='#1f2430'; ctx.strokeRect(mx-3,my-3,mw+6,mh+6);
}

// DOM 里画 sprite（标题/战斗肖像用）
function spriteCanvasHTML(id, px){
  return `<canvas class="spr" width="${px}" height="${px}" data-spr="${id}" style="width:${px}px;height:${px}px"></canvas>`;
}
function paintDomSprites(){
  document.querySelectorAll('canvas.spr[data-spr]').forEach(cv => {
    const c = cv.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.clearRect(0,0,cv.width,cv.height);
    c.drawImage(getSprite(cv.dataset.spr), 0,0,SPR,SPR, 0,0,cv.width,cv.height);
  });
}

// ================================================================
// 战斗屏（问答）
// ================================================================
function startBattle(mid){
  G.mid = mid; G.qi = 0; G.results = []; G.chosen = null; G.ok = null; G.bphase = 'q';
  G.screen = 'battle';
  render();
}

function playerBarHTML(){
  const pct = Math.max(0,(G.hp/MAX_HP)*100).toFixed(1);
  return `<div class="player-bar">
    <span class="pb-label">HP</span>
    <div class="pb-track"><div class="pb-fill" style="width:${pct}%;background:${hpColor(G.hp)}"></div></div>
    <span class="pb-val">${G.hp} / ${MAX_HP}</span>
    <span class="pb-chip">✦ ${G.score} 分</span>
  </div>`;
}

function battleHTML(){
  if (G.bphase === 'end') return battleEndHTML();
  const m = monster(), qq = q(), totalQ = qs().length, revealed = (G.bphase==='reveal');
  const labels = ['A','B','C','D'];

  const pins = Array.from({length: totalQ}, (_,i) => {
    let cls = 'full';
    if (G.results[i] === true) cls = 'empty';
    else if (revealed && i===G.qi && G.ok) cls = 'empty';
    return `<div class="pip ${cls}" style="--mc:${m.color}"></div>`;
  }).join('');

  const answers = qq.opts.map((opt,i) => {
    let cls = '';
    if (revealed){
      if (i===qq.ans) cls='a-reveal';
      else if (i===G.chosen && i!==qq.ans) cls='a-wrong';
    }
    return `<button class="a-btn ${cls}" data-c="${i}" ${revealed?'disabled':''}>
      <span class="lbl">${labels[i]}</span>${opt}</button>`;
  }).join('');

  let logMsg = '▶ 选择你的答案...';
  if (revealed){
    logMsg = G.ok
      ? `✦ 命中！架构师的判断斩断了反模式！（+${PTS_Q} 分）`
      : `✘ 错误！${m.name}发动攻击，你失去了 ${PENALTY} HP。`;
    if (!G.ok && G.hp<=0) logMsg += ' HP 归零，生产 503...';
  }

  const expColor = G.ok ? '#2d7d46' : '#c0392b';

  return `<div class="battle" style="--mc:${m.color}">
    ${playerBarHTML()}
    <div class="monster-card" id="mc" style="--mc:${m.color}">
      <div class="mc-header">
        <div class="mc-emoji">${spriteCanvasHTML(m.id, 64)}</div>
        <div class="mc-meta">
          <h2 class="mc-name" style="color:${m.color}">${m.name}</h2>
          <span class="mc-zone" style="background:${m.color}">${m.zone}</span>
          <div class="mc-pips">${pins}<span class="mc-pips-label">怪物 HP</span></div>
        </div>
      </div>
      <div class="mc-flavor">${m.flavor}</div>
    </div>
    <div class="q-card" id="qc">
      <p class="q-meta">问题 ${G.qi+1} / ${totalQ}</p>
      <p class="q-text">${qq.q}</p>
      <div class="answers">${answers}</div>
    </div>
    <div class="battle-log">${logMsg}</div>
    ${revealed ? `<p class="exp-line" style="color:${expColor}">💡 ${qq.exp}</p>` : ''}
    ${revealed ? `<button class="btn-continue" id="btn-next-q">继续 →</button>` : ''}
  </div>`;
}

function battleEndHTML(){
  const m = monster();
  const correct = G.results.filter(Boolean).length;
  const perfect = correct === qs().length;
  const earned = correct*PTS_Q + (perfect?PTS_PERF:0);
  const rPips = G.results.map(r => `<div class="rp ${r?'ok':'bad'}"></div>`).join('');
  const badge = perfect ? '🏆' : correct>=2 ? '⚔️' : '🩹';
  const title = perfect ? '完美击败！' : correct>=2 ? '击退成功' : '险胜...';

  return `<div class="battle" style="--mc:${m.color}">
    ${playerBarHTML()}
    <div class="end-card">
      <span class="end-badge">${badge}</span>
      <h2 class="end-title">${title}</h2>
      <p class="end-subtitle">${perfect
        ? `全部答对！获得 ${earned} 分（含完美奖励 +${PTS_PERF}）`
        : `答对 ${correct} / ${qs().length}，获得 ${earned} 分`}</p>
      <div class="end-pips">${rPips}</div>
      ${perfect ? `<p class="bonus-note">🌿 完美！HP 恢复 ${PERFECT_HP} 点。</p>` : ''}
      <a class="end-learn" href="${m.learnHref}" target="_blank">${m.learnText} →</a>
      <button class="btn-continue" id="btn-back-map">${allCleared()
        ? '反模式已全部清除，返回地图前往终点 →'
        : '返回地图 →'}</button>
    </div>
  </div>`;
}

function bindBattle(){
  document.querySelectorAll('.a-btn:not([disabled])').forEach(b => {
    b.onclick = () => answer(+b.dataset.c);
  });
  const nq = document.getElementById('btn-next-q');
  if (nq) nq.onclick = () => nextQ();
  const bm = document.getElementById('btn-back-map');
  if (bm) bm.onclick = () => backToMap();
}

function answer(choice){
  if (G.bphase !== 'q') return;
  const qq = q();
  const ok = choice === qq.ans;
  G.chosen = choice; G.ok = ok; G.results.push(ok);
  if (!ok) G.hp = Math.max(0, G.hp - PENALTY);
  G.bphase = 'reveal';
  render();
  if (!ok){
    const qc = document.getElementById('qc');
    if (qc){ qc.classList.add('do-shake'); qc.addEventListener('animationend', ()=>qc.classList.remove('do-shake'), {once:true}); }
    if (G.hp<=0){ setTimeout(()=>{ G.screen='gameover'; render(); }, 1400); }
  }
}

function nextQ(){
  if (G.hp<=0){ G.screen='gameover'; render(); return; }
  if (G.qi+1 >= qs().length){
    // 结算本场战斗
    const correct = G.results.filter(Boolean).length;
    const perfect = correct === qs().length;
    G.score += correct*PTS_Q;
    if (perfect){ G.score += PTS_PERF; G.hp = Math.min(MAX_HP, G.hp+PERFECT_HP); }
    G.defeated[G.mid] = true;   // 怪物被击败，从地图移除
    G.bphase = 'end';
  } else {
    G.qi++; G.chosen=null; G.ok=null; G.bphase='q';
  }
  render();
}

function backToMap(){
  // 击败中央雕像 Boss（孤岛 Agent）即通关
  if (G.defeated['robot']){ G.screen = 'victory'; render(); return; }
  G.screen = 'map';
  if (statueAwake()) showBanner('🗿 六种反模式已清除！广场中央的雕像苏醒了——回去迎战隐藏 Boss');
  render();
}

// ================================================================
// 结局屏
// ================================================================
function gameoverHTML(){
  return `<div class="screen-center">
    <span class="final-icon">💀</span>
    <h1 class="final-title">503 — 生产已倒下</h1>
    <p class="final-sub" style="color:#c0392b">HP 归零，AI-native 工程师不合格</p>
    <p class="final-score">本局得分：${G.score} 分</p>
    <p class="final-body">没关系——GitHire 的六步 workflow 就是为了让真实事故不再发生。回去读一读，再来挑战。</p>
    <div class="btn-row">
      <button class="g-btn solid" id="btn-retry">重新挑战</button>
      <a class="g-btn ghost" href="./index.html">返回 GitHire</a>
    </div>
  </div>`;
}

function victoryHTML(){
  const rank =
    G.score >= 2500 ? '首席架构师 · Chief Architect' :
    G.score >= 1800 ? '资深工程师 · Senior Engineer' :
    G.score >= 1200 ? '合格 AI-native 工程师' :
                      '见习工程师 · Junior Engineer';
  const shareText = `我在 PokeHire 走通了 AI-native 工程地图，击败 7 种工程反模式，得分 ${G.score} 分，头衔：${rank.split('·')[0].trim()}。\n\nGitHire 方法论：人指挥 AI 干活，不是 AI 辅助人。\n→ https://realroc.github.io/git-hired/game.html`;
  window.__SHARE__ = shareText;

  return `<div class="screen-center">
    <span class="final-icon" style="animation:bob 2s ease-in-out infinite">🚀</span>
    <h1 class="final-title" style="color:var(--accent)">通关！抵达 Production</h1>
    <p class="final-sub">七种工程反模式已全部击败</p>
    <p class="final-score">最终得分：${G.score} 分 · 头衔：${rank}</p>
    <p class="final-body">恭喜你走通了这张地图，也理解了 GitHire 核心方法论：<br/><strong>人 frame、AI 执行、架构师判断。</strong></p>
    <div class="btn-row">
      <button class="g-btn solid" id="btn-share">复制分享文案</button>
      <button class="g-btn ghost" id="btn-retry">再玩一次</button>
      <a class="g-btn ghost" href="./index.html">返回 GitHire</a>
    </div>
    <p id="share-ok" class="share-ok">✓ 已复制！</p>
    <p class="final-links">深入阅读：
      <a href="./case-redis-scan.html">Case 01 · Redis 事故</a> ·
      <a href="./skill.html">安装 GitHire Skill</a>
    </p>
  </div>`;
}

function bindEnd(){
  document.querySelectorAll('#btn-retry').forEach(b => {
    b.onclick = () => startGame();
  });
  const sh = document.getElementById('btn-share');
  if (sh) sh.onclick = () => {
    navigator.clipboard.writeText(window.__SHARE__||'').then(()=>{
      const ok = document.getElementById('share-ok'); if (ok) ok.style.display='block';
    }).catch(()=>{
      const ok = document.getElementById('share-ok'); if (ok){ ok.textContent='✓ 请手动复制上方文案'; ok.style.display='block'; }
    });
  };
}

// ================================================================
// 启动
// ================================================================
render();
</script>
