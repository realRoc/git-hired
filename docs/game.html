  <link rel="stylesheet" href="githire.css" />

  <style>
    /* ── Game page overrides ─────────────────────────────── */
    #stage { display: none; }
    main, .topnav, .site-foot { position: relative; z-index: 1; }
    body { background: var(--paper); }

    /* ── Layout ──────────────────────────────────────────── */
    .game-wrap {
      padding-top: 72px; /* topnav height */
      min-height: 100vh;
    }

    /* ── Title screen ────────────────────────────────────── */
    .s-title {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem clamp(20px, 6vw, 80px);
    }
    .title-eyebrow {
      font-style: italic;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin: 0 0 0.75rem;
    }
    .title-logo {
      font-size: clamp(3.5rem, 12vw, 7rem);
      font-weight: 600;
      line-height: 0.85;
      letter-spacing: -0.025em;
      margin: 0 0 0.4rem;
      color: var(--ink);
    }
    .title-logo em { color: var(--accent); font-style: normal; }
    .title-tagline {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 1.05rem;
      margin: 0 0 1.75rem;
    }
    .monster-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(0.4rem, 2vw, 0.9rem);
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 2rem;
    }
    .monster-row span {
      display: inline-block;
      animation: m-bob 2.4s ease-in-out infinite;
      cursor: default;
    }
    .monster-row span:nth-child(2) { animation-delay:.35s }
    .monster-row span:nth-child(3) { animation-delay:.7s }
    .monster-row span:nth-child(4) { animation-delay:1.05s }
    .monster-row span:nth-child(5) { animation-delay:1.4s }
    .monster-row span:nth-child(6) { animation-delay:1.75s }
    .monster-row span:nth-child(7) { animation-delay:2.1s }
    @keyframes m-bob {
      0%,100% { transform: translateY(0) }
      50% { transform: translateY(-10px) }
    }
    .title-desc {
      font-style: italic;
      color: var(--ink-soft);
      font-size: 0.9rem;
      line-height: 1.8;
      max-width: 400px;
      margin: 0 0 2.25rem;
    }
    .title-hint {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--ink-mute);
      font-style: italic;
    }

    /* ── Monster intro screen ────────────────────────────── */
    .s-intro {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem clamp(20px, 6vw, 80px);
    }
    .intro-breadcrumb {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      font-style: italic;
      color: var(--ink-mute);
      text-transform: uppercase;
      margin: 0 0 2rem;
    }
    .intro-emoji {
      font-size: clamp(4rem, 15vw, 7rem);
      line-height: 1;
      display: block;
      margin: 0 0 1rem;
      animation: m-enter .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes m-enter {
      from { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(6px); }
      to   { transform: scale(1) rotate(0); opacity: 1; filter: blur(0); }
    }
    .intro-zone-tag {
      display: inline-block;
      padding: .2rem .65rem;
      border-radius: 4px;
      color: #fff;
      font-size: 0.7rem;
      font-style: italic;
      letter-spacing: .06em;
      margin: 0 0 .75rem;
      background: var(--mc, var(--accent));
    }
    .intro-name {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 600;
      color: var(--mc, var(--ink));
      margin: 0 0 1rem;
    }
    .intro-flavor {
      font-style: italic;
      color: var(--ink-soft);
      line-height: 1.75;
      max-width: 480px;
      font-size: 0.95rem;
      margin: 0 0 2.25rem;
    }

    /* ── Battle screen ───────────────────────────────────── */
    .s-battle {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem clamp(16px, 4vw, 48px) 4rem;
    }

    /* Player bar */
    .player-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: var(--ink);
      color: var(--paper);
      border-radius: 10px;
      padding: .7rem 1.1rem;
      margin-bottom: 1.1rem;
      flex-wrap: wrap;
    }
    .bar-label {
      font-style: italic;
      font-size: .8rem;
      opacity: .65;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      min-width: 80px;
      height: 9px;
      background: rgba(255,255,255,.15);
      border-radius: 5px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width .55s ease, background .55s ease;
    }
    .bar-val {
      font-style: italic;
      font-size: .8rem;
      opacity: .85;
      white-space: nowrap;
    }
    .score-chip {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      padding: .2rem .7rem;
      border-radius: 999px;
      font-style: italic;
      font-size: .8rem;
      white-space: nowrap;
    }

    /* Monster card */
    .monster-card {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      padding: 1.25rem 1.4rem;
      margin-bottom: 1.1rem;
      position: relative;
      overflow: hidden;
    }
    .monster-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--mc, var(--accent));
    }
    .mc-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: .75rem;
    }
    .mc-emoji {
      font-size: clamp(2.5rem, 7vw, 3.5rem);
      line-height: 1;
      flex-shrink: 0;
      animation: mc-pulse 3s ease-in-out infinite;
    }
    @keyframes mc-pulse {
      0%,100% { transform: scale(1) }
      50% { transform: scale(1.06) }
    }
    .mc-meta { flex: 1; min-width: 0; }
    .mc-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--mc, var(--ink));
      margin: 0 0 .3rem;
    }
    .mc-zone {
      display: inline-block;
      padding: .15rem .5rem;
      border-radius: 4px;
      background: var(--mc, var(--accent));
      color: #fff;
      font-size: .68rem;
      font-style: italic;
      letter-spacing: .05em;
    }
    .mc-pips {
      display: flex;
      gap: 5px;
      margin-top: .55rem;
      align-items: center;
    }
    .pip {
      width: 22px;
      height: 10px;
      border-radius: 3px;
      border: 1.5px solid var(--mc, var(--accent));
      transition: background .3s;
    }
    .pip.full  { background: var(--mc, var(--accent)); }
    .pip.empty { background: transparent; }
    .mc-pips-label {
      font-size: .7rem;
      font-style: italic;
      color: var(--ink-mute);
      margin-left: .25rem;
    }
    .mc-flavor {
      font-style: italic;
      font-size: .88rem;
      color: var(--ink-soft);
      border-top: 1px solid var(--line);
      padding-top: .75rem;
      line-height: 1.7;
    }

    /* Question card */
    .q-card {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      padding: 1.4rem;
      margin-bottom: .9rem;
    }
    .q-meta {
      font-size: .72rem;
      font-style: italic;
      letter-spacing: .09em;
      color: var(--ink-mute);
      text-transform: uppercase;
      margin: 0 0 .9rem;
    }
    .q-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.7;
      color: var(--ink);
      margin: 0 0 1.4rem;
    }
    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
    }
    @media (max-width: 520px) { .answers { grid-template-columns: 1fr; } }
    .a-btn {
      text-align: left;
      padding: .75rem .95rem;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font-size: .88rem;
      line-height: 1.5;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      font-family: var(--font-serif);
    }
    .a-btn:not(:disabled):hover {
      border-color: var(--accent);
      background: rgba(217,119,87,.07);
    }
    .a-btn .lbl {
      font-weight: 600;
      color: var(--accent);
      margin-right: .25rem;
    }
    .a-btn.a-correct {
      background: #e8f5e9;
      border-color: #2d7d46;
      color: #1b5e20;
    }
    .a-btn.a-wrong {
      background: #ffebee;
      border-color: #c0392b;
      color: #b71c1c;
    }
    .a-btn.a-reveal {
      background: #e8f5e9;
      border-color: #2d7d46;
      color: #1b5e20;
    }
    .a-btn:disabled { cursor: default; }

    /* Battle log */
    .battle-log {
      font-style: italic;
      font-size: .88rem;
      color: var(--ink-soft);
      padding: .7rem 1rem;
      background: rgba(24,24,24,.04);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      min-height: 2.4rem;
      margin-bottom: .9rem;
      line-height: 1.5;
    }

    /* Continue/action buttons */
    .btn-continue {
      display: block;
      width: 100%;
      padding: .9rem;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 8px;
      font-family: var(--font-serif);
      font-size: 1rem;
      font-style: italic;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-continue:hover { background: #000; }

    /* ── Battle end card ─────────────────────────────────── */
    .s-end {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem clamp(16px, 4vw, 48px) 4rem;
    }
    .end-card {
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      padding: 2rem;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
    }
    .end-badge { font-size: 3.5rem; display: block; margin-bottom: .9rem; animation: m-bob 2s ease-in-out infinite; }
    .end-title { font-size: 1.5rem; font-weight: 600; margin: 0 0 .4rem; }
    .end-subtitle { font-style: italic; color: var(--ink-soft); font-size: .9rem; margin: 0 0 1.3rem; }
    .end-result-pips { display: flex; justify-content: center; gap: .45rem; margin: 0 0 .9rem; }
    .rp { width: 36px; height: 14px; border-radius: 4px; }
    .rp.ok  { background: #2d7d46; }
    .rp.bad { background: #c0392b; }
    .end-learn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      color: var(--accent);
      font-style: italic;
      text-decoration: none;
      font-size: .88rem;
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
      margin-bottom: 1.4rem;
    }
    .end-learn:hover { border-bottom-color: var(--accent); }
    .bonus-note { color: #2d7d46; font-style: italic; font-size: .85rem; margin: 0 0 .9rem; }

    /* ── Final screens ───────────────────────────────────── */
    .s-final {
      min-height: calc(100vh - 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem clamp(20px, 6vw, 80px);
    }
    .final-icon { font-size: 5rem; display: block; margin-bottom: 1rem; }
    .final-title { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 600; margin: 0 0 .5rem; }
    .final-sub { font-style: italic; font-size: 1rem; color: var(--ink-soft); margin: 0 0 .5rem; }
    .final-score { font-style: italic; color: var(--accent); font-size: 1.1rem; margin: 0 0 1.5rem; }
    .final-body { font-style: italic; color: var(--ink-soft); font-size: .9rem; line-height: 1.8; max-width: 420px; margin: 0 0 2rem; }
    .btn-row { display: flex; gap: .65rem; flex-wrap: wrap; justify-content: center; }
    .g-btn {
      padding: .75rem 1.75rem;
      border-radius: 999px;
      font-family: var(--font-serif);
      font-style: italic;
      font-size: .95rem;
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      display: inline-block;
      border: 1px solid transparent;
    }
    .g-btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .g-btn.solid:hover { background: #000; }
    .g-btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .g-btn.ghost:hover { background: rgba(24,24,24,.05); }
    .final-links { margin-top: 2rem; font-size: .78rem; color: var(--ink-mute); font-style: italic; }
    .final-links a { color: var(--accent); }
    .share-ok { color: #2d7d46; font-style: italic; font-size: .85rem; margin-top: .6rem; display: none; }

    /* ── Animations ──────────────────────────────────────── */
    @keyframes shake {
      0%,100% { transform: translateX(0) }
      15%,45%,75% { transform: translateX(-7px) }
      30%,60%,90% { transform: translateX(7px) }
    }
    .do-shake { animation: shake .42s ease; }

    @keyframes flash-ok {
      0%   { background: #fff }
      25%  { background: #e8f5e9 }
      100% { background: #fff }
    }
    @keyframes flash-err {
      0%   { background: #fff }
      25%  { background: #ffebee }
      100% { background: #fff }
    }
    .flash-ok  { animation: flash-ok  .45s ease; }
    .flash-err { animation: flash-err .45s ease; }

    /* ── Responsive nav override ─────────────────────────── */
    .nav-game-link {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 500;
      font-size: 15px;
      color: var(--accent);
      text-decoration: none;
      padding: 11px 18px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      transition: background .18s, color .18s;
    }
    .nav-game-link:hover { background: var(--accent); color: #fff; }
  </style>
</head>

<script>
// ================================================================

const MONSTERS = [

const QUESTIONS = {
  ghost: [
    {

// ================================================================
// CONFIG
// ================================================================
const MAX_HP   = 100;
const PENALTY  = 15;
const PERFECT_HP = 20;
const PTS_Q    = 100;
const PTS_PERF = 150;

// ================================================================
// STATE
// ================================================================
let G = freshState();
function freshState() {
  return {
    phase: 'title',   // title|intro|battle|reveal|bend|gameover|victory
    hp: MAX_HP,
    score: 0,
    mi: 0,            // monster index
    qi: 0,            // question index
    results: [],      // bool[] for current battle
    chosen: null,     // selected answer index
    ok: null,         // was it correct?
  };
}

function monster()   { return MONSTERS[G.mi]; }
function qs()        { return QUESTIONS[monster().id]; }
function q()         { return qs()[G.qi]; }

// ================================================================
// RENDER HELPERS
// ================================================================
function hpColor(hp) {
  return hp > 55 ? '#2d7d46' : hp > 25 ? '#e67e22' : '#c0392b';
}

function playerBarHTML() {
  const pct = Math.max(0, (G.hp / MAX_HP) * 100).toFixed(1);
  return `<div class="player-bar">
    <span class="bar-label">HP</span>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${hpColor(G.hp)}"></div></div>
    <span class="bar-val">${G.hp} / ${MAX_HP}</span>
    <span class="score-chip">✦ ${G.score} 分</span>
  </div>`;
}

function pipsHTML(mColor, numQ, results, revealIdx, revealOk) {
  return Array.from({length: numQ}, (_, i) => {
    let cls = 'full';
    if (results[i] === true) cls = 'empty';
    else if (i === revealIdx && revealOk) cls = 'empty';
    return `<div class="pip ${cls}" style="--mc:${mColor}"></div>`;
  }).join('');
}

// ================================================================
// RENDER
// ================================================================
function render() {
  const root = document.getElementById('gr');
  root.innerHTML = html();
  bind();
}

function html() {
  if (G.phase === 'title')    return titleHTML();
  if (G.phase === 'intro')    return introHTML();
  if (G.phase === 'battle')   return battleHTML(false);
  if (G.phase === 'reveal')   return battleHTML(true);
  if (G.phase === 'bend')     return bendHTML();
  if (G.phase === 'gameover') return gameoverHTML();
  if (G.phase === 'victory')  return victoryHTML();
  return '';
}

function titleHTML() {
  const emojis = MONSTERS.map(m => `<span title="${m.name}">${m.emoji}</span>`).join('');
  return `<div class="s-title">
    <p class="title-eyebrow">GitHire · Knowledge Challenge</p>
    <h1 class="title-logo"><em>Poke</em>Hire</h1>
    <p class="title-tagline">七场 AI-native 工程对决</p>
    <div class="monster-row">${emojis}</div>
    <p class="title-desc">
      七种工程反模式化身怪物等你击败。<br/>
      答对驱散它们，答错失去 HP。<br/>
      HP 归零，生产 503。
    </p>
    <button class="g-btn solid" id="btn-start" style="font-size:1.05rem;padding:.9rem 2.5rem;">开始挑战 →</button>
    <p class="title-hint">共 7 关 · 21 题 · 约 5 分钟</p>
  </div>`;
}

function introHTML() {
  const m = monster();
  return `<div class="s-intro" style="--mc:${m.color}">
    <p class="intro-breadcrumb">第 ${G.mi + 1} / ${MONSTERS.length} 关</p>
    <span class="intro-emoji">${m.emoji}</span>
    <span class="intro-zone-tag" style="background:${m.color}">${m.zone}</span>
    <h2 class="intro-name" style="color:${m.color}">${m.name}</h2>
    <p class="intro-flavor">${m.flavor}</p>
    <button class="g-btn solid" id="btn-fight">⚔️ 迎战！</button>
  </div>`;
}

function battleHTML(revealed) {
  const m   = monster();
  const qq  = q();
  const totalQ = qs().length;
  const labels = ['A', 'B', 'C', 'D'];

  const pins = pipsHTML(m.color, totalQ, G.results,
    revealed ? G.qi : -1, revealed ? G.ok : false);

  const answersHTML = qq.opts.map((opt, i) => {
    let cls = '';
    if (revealed) {
      if (i === qq.ans)                      cls = 'a-reveal';
      else if (i === G.chosen && i !== qq.ans) cls = 'a-wrong';
    }
    return `<button class="a-btn ${cls}" data-c="${i}" ${revealed ? 'disabled' : ''}>
      <span class="lbl">${labels[i]}</span>${opt}
    </button>`;
  }).join('');

  let logMsg = '▶ 选择你的答案...';
  if (revealed) {
    logMsg = G.ok
      ? `✦ 命中！架构师的判断斩断了反模式！（+${PTS_Q} 分）`
      : `✘ 错误！${m.name}发动攻击！你失去了 ${PENALTY} HP。`;
    if (!G.ok && G.hp <= 0) logMsg += ' HP 归零，生产 503...';
  }

  const continueBtn = revealed
    ? `<button class="btn-continue" id="btn-next-q">继续 →</button>` : '';

  return `<div class="s-battle" style="--mc:${m.color}">
    ${playerBarHTML()}
    <div class="monster-card" id="mc" style="--mc:${m.color}">
      <div class="mc-header">
        <div class="mc-emoji">${m.emoji}</div>
        <div class="mc-meta">
          <h2 class="mc-name" style="color:${m.color}">${m.name}</h2>
          <span class="mc-zone" style="background:${m.color}">${m.zone}</span>
          <div class="mc-pips">
            ${pins}
            <span class="mc-pips-label">怪物 HP</span>
          </div>
        </div>
      </div>
      <div class="mc-flavor">${m.flavor}</div>
    </div>
    <div class="q-card" id="qc">
      <p class="q-meta">问题 ${G.qi + 1} / ${totalQ}</p>
      <p class="q-text">${qq.q}</p>
      <div class="answers">${answersHTML}</div>
    </div>
    <div class="battle-log" id="blog">${logMsg}</div>
    ${revealed && G.ok ? `<p style="font-size:.8rem;font-style:italic;color:#2d7d46;margin-bottom:.6rem;padding-left:.2rem;">💡 ${qq.exp}</p>` : ''}
    ${revealed && !G.ok ? `<p style="font-size:.8rem;font-style:italic;color:#c0392b;margin-bottom:.6rem;padding-left:.2rem;">💡 ${qq.exp}</p>` : ''}
    ${continueBtn}
  </div>`;
}

function bendHTML() {
  const m = monster();
  const correct = G.results.filter(Boolean).length;
  const perfect = correct === qs().length;
  const earned  = correct * PTS_Q + (perfect ? PTS_PERF : 0);
  const isLast  = G.mi >= MONSTERS.length - 1;

  const rPips = G.results.map(r =>
    `<div class="rp ${r ? 'ok' : 'bad'}"></div>`).join('');

  const badge = perfect ? '🏆' : correct >= 2 ? '⚔️' : '🩹';
  const title = perfect ? '完美击败！' : correct >= 2 ? '击退成功' : '险胜...';

  return `<div class="s-end" style="--mc:${m.color}">
    ${playerBarHTML()}
    <div class="end-card">
      <span class="end-badge">${badge}</span>
      <h2 class="end-title">${title}</h2>
      <p class="end-subtitle">
        ${perfect
          ? `全部答对！获得 ${earned} 分（含完美奖励 +${PTS_PERF}）`
          : `答对 ${correct} / ${qs().length}，获得 ${earned} 分`}
      </p>
      <div class="end-result-pips">${rPips}</div>
      ${perfect ? `<p class="bonus-note">🌿 完美！HP 恢复 ${PERFECT_HP} 点。</p>` : ''}
      <a class="end-learn" href="${m.learnHref}" target="_blank">${m.learnText} →</a>
      <button class="btn-continue" id="btn-next-m">
        ${isLast ? '查看最终结果 →' : `挑战下一关 →`}
      </button>
    </div>
  </div>`;
}

function gameoverHTML() {
  return `<div class="s-final">
    <span class="final-icon">💀</span>
    <h1 class="final-title">503 — 生产已倒下</h1>
    <p class="final-sub" style="color:#c0392b">HP 归零，AI-native 工程师不合格</p>
    <p class="final-score">本局得分：${G.score} 分</p>
    <p class="final-body">没关系——GitHire 的六步 workflow 就是为了让真实事故不再发生。回去读一读，再来挑战。</p>
    <div class="btn-row">
      <button class="g-btn solid" id="btn-retry">重新挑战</button>
      <a class="g-btn ghost" href="./index.html">返回 GitHire</a>
    </div>
  </div>`;
}

function victoryHTML() {
  const rank =
    G.score >= 2500 ? '首席架构师 · Chief Architect' :
    G.score >= 1800 ? '资深工程师 · Senior Engineer' :
    G.score >= 1200 ? '合格 AI-native · AI-native Engineer' :
                      '见习工程师 · Junior Engineer';

  const shareText = `我在 PokeHire 击败了 7 种 AI-native 工程反模式，得分 ${G.score} 分，头衔：${rank.split('·')[0].trim()}。\n\nGitHire 方法论：人指挥 AI 干活，不是 AI 辅助人。\n→ https://realroc.github.io/git-hired/game.html`;
  window.__SHARE__ = shareText;

  return `<div class="s-final">
    <span class="final-icon" style="animation:m-bob 2s ease-in-out infinite">🏆</span>
    <h1 class="final-title" style="color:var(--accent)">通关！</h1>
    <p class="final-sub">七种工程反模式已全部击败</p>
    <p class="final-score">最终得分：${G.score} 分 · 头衔：${rank}</p>
    <p class="final-body">恭喜你理解了 GitHire 核心方法论：<br/><strong>人 frame、AI 执行、架构师判断。</strong></p>
    <div class="btn-row">
      <button class="g-btn solid" id="btn-share">复制分享文案</button>
      <button class="g-btn ghost" id="btn-retry">再玩一次</button>
      <a class="g-btn ghost" href="./index.html">返回 GitHire</a>
    </div>
    <p id="share-ok" class="share-ok">✓ 已复制！</p>
    <p class="final-links">
      深入阅读：
      <a href="./case-redis-scan.html">Case 01 · Redis 事故</a> ·
      <a href="./skill.html">安装 GitHire Skill</a>
    </p>
  </div>`;
}

// ================================================================
// BIND EVENTS
// ================================================================
function bind() {
  function el(id) { return document.getElementById(id); }

  // Title
  const s = el('btn-start');
  if (s) s.onclick = () => { G = freshState(); G.phase = 'intro'; render(); };

  // Intro → battle
  const f = el('btn-fight');
  if (f) f.onclick = () => { G.qi = 0; G.results = []; G.phase = 'battle'; render(); };

  // Answer buttons
  document.querySelectorAll('.a-btn:not([disabled])').forEach(btn => {
    btn.onclick = () => answer(+btn.dataset.c);
  });

  // After reveal → next q
  const nq = el('btn-next-q');
  if (nq) nq.onclick = () => nextQ();

  // Battle end → next monster
  const nm = el('btn-next-m');
  if (nm) nm.onclick = () => nextM();

  // Retry
  document.querySelectorAll('#btn-retry').forEach(b => {
    b.onclick = () => { G = freshState(); render(); };
  });

  // Share
  const sh = el('btn-share');
  if (sh) sh.onclick = () => {
    navigator.clipboard.writeText(window.__SHARE__ || '').then(() => {
      const ok = el('share-ok');
      if (ok) ok.style.display = 'block';
    }).catch(() => {
      const ok = el('share-ok');
      if (ok) { ok.textContent = '✓ 请手动复制上方文案'; ok.style.display = 'block'; }
    });
  };
}

// ================================================================
// ACTIONS
// ================================================================
function answer(choice) {
  if (G.phase !== 'battle') return;
  const qq = q();
  const ok = choice === qq.ans;
  G.chosen = choice;
  G.ok = ok;
  G.results.push(ok);
  if (!ok) G.hp = Math.max(0, G.hp - PENALTY);
  G.phase = 'reveal';
  render();

  // Shake on wrong
  if (!ok) {
    const qc = document.getElementById('qc');
    if (qc) {
      qc.classList.add('do-shake');
      qc.addEventListener('animationend', () => qc.classList.remove('do-shake'), { once: true });
    }
    if (G.hp <= 0) {
      setTimeout(() => { G.phase = 'gameover'; render(); }, 1400);
    }
  }
}

function nextQ() {
  if (G.hp <= 0) { G.phase = 'gameover'; render(); return; }
  if (G.qi + 1 >= qs().length) {
    // All questions answered — tally battle
    const correct = G.results.filter(Boolean).length;
    const perfect = correct === qs().length;
    G.score += correct * PTS_Q;
    if (perfect) {
      G.score += PTS_PERF;
      G.hp = Math.min(MAX_HP, G.hp + PERFECT_HP);
    }
    G.phase = 'bend';
  } else {
    G.qi++;
    G.chosen = null;
    G.ok = null;
    G.phase = 'battle';
  }
  render();
}

function nextM() {
  if (G.mi + 1 >= MONSTERS.length) {
    G.phase = 'victory';
  } else {
    G.mi++;
    G.qi = 0;
    G.results = [];
    G.chosen = null;
    G.ok = null;
    G.phase = 'intro';
  }
  render();
}

// ================================================================
// INIT
// ================================================================
render();
</script>
